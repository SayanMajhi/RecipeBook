<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pinch of Yum</title>
    <link rel="icon" href="icon.png" type="image/png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="top-bar">💛 OUR RECIPES, YOUR INBOX. <a href="#">SIGN UP</a></div>
        <nav class="navbar">
            <h1 class="logo">bites<span>of</span>heaven</h1>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">RECIPES</a></li>
                <li><a href="#">START HERE</a></li>
                <li><a href="#"><span class="search-icon">🔍</span></a></li>
            </ul>
        </nav>
    </header>

    <section class="intro">
        <p>SIMPLE RECIPES MADE FOR <em>real, actual, everyday life.</em></p>
    </section>
    <div class="block">

        <section class="catagories">
            <div class="card">
                <img src="dinner.jpg" alt="Dinner">
                <div class="overlay"></div>
                <button class="label">DINNER</button>
            </div>
            <div class="card">
                <img src="mostpopular.webp" alt="Most Popular">
                <div class="overlay"></div>
                <button class="label">MOST POPULAR</button>
            </div>
            <div class="card">
                <img src="quickandeasy.jpg" alt="Quick and Easy">
                <div class="overlay"></div>
                <button class="label">QUICK AND EASY</button>
            </div>
            <div class="card">
                <img src="airfriyer.webp" alt="Air Fryer">
                <div class="overlay"></div>
                <button class="label">AIR FRYER</button>
            </div>
        </section>


        <section class="filters">

            <div class="circle-card">
                <div class="circle">
                    <img src="./circle/lunch.jpg" alt="">
                </div>
                <div class="circle-overlay"></div>
                <span>LUNCH</span>
            </div>

            <div class="circle-card">
                <div class="circle">
                    <img src="./circle/breakfast.jpg" alt="">
                </div>
                <div class="circle-overlay"></div>
                <span>BREAKFAST</span>
            </div>

            <div class="circle-card">
                <div class="circle">
                    <img src="./circle/vegeterian.webp" alt="">
                </div>
                <div class="circle-overlay"></div>
                <span>VEGETARIAN</span>
            </div>
            <div class="circle-card">
                <div class="circle">
                    <img src="./circle/healthy.jpg" alt="">
                </div>
                <div class="circle-overlay"></div>
                <span>HEALTHY</span>
            </div>
            <div class="circle-card">
                <div class="circle">
                    <img src="./circle/instantpot.jpg" alt="">
                </div>
                <div class="circle-overlay"></div>
                <span>INSTANT POT</span>
            </div>
            <div class="circle-card">
                <div class="circle">
                    <img src="./circle/vegan.jpg" alt="">
                </div>
                <div class="circle-overlay"></div>
                <span>VEGAN</span>
            </div>
            <div class="circle-card">
                <div class="circle">
                    <img src="./circle/mealprep.jpg" alt="">
                </div>
                <div class="circle-overlay"></div>
                <span>MEAL PREP</span>
            </div>
            <div class="circle-card">
                <div class="circle">
                    <img src="./circle/soups.jpg" alt="">
                </div>
                <div class="circle-overlay"></div>
                <span>SOUPS</span>
            </div>
            <div class="circle-card">
                <div class="circle">
                    <img src="./circle/salads.webp" alt="">
                </div>
                <div class="circle-overlay"></div>
                <span>SALADS</span>
            </div>
        </section>

        <section class="search-bar">
            <input type="text" placeholder="Search our recipes">
            <button>+ VIEW ALL RECIPES</button>
        </section>
    </div>
</body>

</html>
