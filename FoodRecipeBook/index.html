<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pinch of Yum</title>
    <link rel="icon" href="icon.png" type="image/png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="top-bar">💛 OUR RECIPES, YOUR INBOX. <a href="#">SIGN UP</a></div>
        <nav class="navbar">
            <h1 class="logo">pinch<span>of</span>yum</h1>
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">RECIPES</a></li>
                <li><a href="#">START HERE</a></li>
                <li><a href="#"><span class="search-icon">🔍</span></a></li>
            </ul>
        </nav>
    </header>

    <section class="intro">
        <p>SIMPLE RECIPES MADE FOR <em>real, actual, everyday life.</em></p>
    </section>

    <section class="catagories">
        <div class="card">
            <img src="dinner.jpg" alt="Dinner">
            <button class="label">DINNER</button>
        </div>
        <div class="card">
            <img src="mostpopular.webp" alt="Most Popular">
            <button class="label">MOST POPULAR</button>
        </div>
        <div class="card">
            <img src="quickandeasy.jpg" alt="Quick and Easy">
            <button class="label">QUICK AND EASY</button>
        </div>
        <div class="card">
            <img src="airfriyer.webp" alt="Air Fryer">
            <button class="label">AIR FRYER</button>
        </div>
    </section>


    <section class="filters">
        <div class="circle-btn">QUICK AND EASY</div>
        <div class="circle-btn">DINNER</div>
        <div class="circle-btn">VEGETARIAN</div>
        <div class="circle-btn">HEALTHY</div>
        <div class="circle-btn">INSTANT POT</div>
        <div class="circle-btn">VEGAN</div>
        <div class="circle-btn">MEAL PREP</div>
        <div class="circle-btn">SOUPS</div>
        <div class="circle-btn">SALADS</div>
    </section>

    <section class="search-bar">
        <input type="text" placeholder="Search our recipes">
        <button>+ VIEW ALL RECIPES</button>
    </section>

    <p>Hello World</p>
</body>

</html>
